name: ci

on:
  push:
  pull_request:

jobs:
  verify-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts
      - name: Build lib
        run: npm run prepare
      - name: Structural verify
        run: npm run verify
      - name: Unit tests
        run: npm run test
